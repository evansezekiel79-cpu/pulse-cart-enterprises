<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Cart Enterprises | Discover Tech</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{color:#22c55e}

.cart-btn{
  background:#22c55e;
  color:#07130b;
  border:0;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111827,#1f2937);
  color:white;
  padding:70px 5%;
  text-align:center;
}

.hero h1{
  font-size:clamp(38px,7vw,70px);
  margin-bottom:14px;
}

.hero h1 span{color:#22c55e}

.hero p{
  max-width:650px;
  margin:auto;
  line-height:1.7;
  color:#d1d5db;
}

.buttons{
  margin-top:25px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  text-decoration:none;
  padding:13px 20px;
  border-radius:10px;
  font-weight:bold;
}

.shop{
  background:#22c55e;
  color:#07130b;
}

.whatsapp{
  background:#25D366;
  color:white;
}

.stats{
  max-width:1100px;
  margin:-30px auto 40px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  position:relative;
}

.stat{
  background:white;
  padding:22px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.stat strong{
  display:block;
  font-size:24px;
  margin-bottom:5px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
